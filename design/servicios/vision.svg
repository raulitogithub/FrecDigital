<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#e6eef8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#00b4d8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="contFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5a9c"/>
      <stop offset="1" stop-color="#1a3a6b"/>
    </linearGradient>
    <linearGradient id="contSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4680"/>
      <stop offset="1" stop-color="#14305a"/>
    </linearGradient>
    <linearGradient id="contTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a6fb5"/>
      <stop offset="1" stop-color="#2a5a9c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b4d8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00b4d8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a3a6b" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a3a6b" flood-opacity="0.15"/>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ribs" width="34" height="10" patternUnits="userSpaceOnUse">
      <rect width="34" height="10" fill="none"/>
      <rect x="0" y="0" width="14" height="10" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Fondo tipo tarjeta, como el resto de imágenes de servicios -->
  <rect width="1024" height="1024" fill="#eef3f9"/>
  <rect x="24" y="24" width="976" height="976" rx="40" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Retícula de suelo -->
  <g stroke="#9fb7d4" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M120 760 L904 760 M160 800 L864 800 M200 840 L824 840"/>
    <path d="M300 720 L220 880 M420 720 L380 880 M540 720 L540 880 M660 720 L700 880 M780 720 L860 880"/>
  </g>

  <!-- Baldosa con icono (arriba a la izquierda) -->
  <g filter="url(#soft)">
    <rect x="70" y="70" width="120" height="120" rx="28" fill="#ffffff" fill-opacity="0.9"/>
  </g>
  <g transform="translate(130 130)" fill="none" stroke="#1a3a6b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-34 -18 V-30 H-22 M22 -30 H34 V-18 M34 18 V30 H22 M-22 30 H-34 V18"/>
    <path d="M-24 0 H24" stroke="#00b4d8"/>
  </g>

  <!-- Contenedor (vista isométrica) -->
  <g filter="url(#shadow)">
    <!-- techo -->
    <path d="M250 330 L640 330 L760 270 L370 270 Z" fill="url(#contTop)"/>
    <!-- lateral largo -->
    <path d="M250 330 L640 330 L640 600 L250 600 Z" fill="url(#contFront)"/>
    <rect x="250" y="330" width="390" height="270" fill="url(#ribs)"/>
    <!-- frontal con puertas -->
    <path d="M640 330 L760 270 L760 540 L640 600 Z" fill="url(#contSide)"/>
  </g>
  <!-- marcos -->
  <g fill="none" stroke="#0f2847" stroke-width="5">
    <path d="M250 330 L640 330 L640 600 L250 600 Z"/>
    <path d="M640 330 L760 270 L760 540 L640 600"/>
  </g>
  <!-- barras de cierre de las puertas -->
  <g stroke="#9fb7d4" stroke-width="6" stroke-linecap="round">
    <path d="M672 330 L672 568"/>
    <path d="M700 316 L700 554"/>
    <path d="M728 302 L728 540"/>
  </g>
  <path d="M700 300 L700 570" stroke="#0f2847" stroke-width="3"/>

  <!-- Número de contenedor con caja de detección -->
  <g>
    <rect x="296" y="372" width="300" height="70" rx="10" fill="#0f2847" fill-opacity="0.55"/>
    <text x="446" y="420" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="3">ABCU 123456 0</text>
    <rect x="286" y="362" width="320" height="90" rx="12" fill="none" stroke="#00e5ff" stroke-width="5" filter="url(#neon)"/>
    <g fill="#00e5ff">
      <rect x="276" y="352" width="26" height="6" rx="3"/><rect x="276" y="352" width="6" height="26" rx="3"/>
      <rect x="590" y="352" width="26" height="6" rx="3"/><rect x="610" y="352" width="6" height="26" rx="3"/>
      <rect x="276" y="456" width="26" height="6" rx="3"/><rect x="276" y="436" width="6" height="26" rx="3"/>
      <rect x="590" y="456" width="26" height="6" rx="3"/><rect x="610" y="436" width="6" height="26" rx="3"/>
    </g>
  </g>

  <!-- Precinto en la puerta, con caja de detección -->
  <g>
    <path d="M700 420 q-18 0 -18 22 v18" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
    <rect x="668" y="456" width="30" height="40" rx="6" fill="#f97316"/>
    <rect x="652" y="402" width="72" height="110" rx="10" fill="none" stroke="#00e5ff" stroke-width="5" filter="url(#neon)"/>
  </g>

  <!-- Etiquetas de lectura -->
  <g filter="url(#soft)">
    <rect x="300" y="196" width="250" height="56" rx="16" fill="#ffffff"/>
  </g>
  <circle cx="330" cy="224" r="14" fill="#10b981"/>
  <path d="M323 224 l5 5 l10 -11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="356" y="232" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a3a6b">Contenedor OK</text>

  <g filter="url(#soft)">
    <rect x="776" y="388" width="178" height="56" rx="16" fill="#ffffff"/>
  </g>
  <circle cx="804" cy="416" r="14" fill="#10b981"/>
  <path d="M797 416 l5 5 l10 -11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="826" y="424" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a3a6b">Precinto OK</text>
  <path d="M724 430 L776 416" stroke="#00b4d8" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Cámara en poste con haz de escaneo -->
  <path d="M905 214 L470 380 L560 470 L905 254 Z" fill="url(#beam)"/>
  <g filter="url(#soft)">
    <rect x="964" y="150" width="14" height="560" rx="7" fill="url(#metal)"/>
    <rect x="866" y="196" width="112" height="64" rx="18" fill="#ffffff"/>
    <rect x="840" y="210" width="40" height="36" rx="10" fill="#1a3a6b"/>
    <circle cx="852" cy="228" r="10" fill="#00e5ff" filter="url(#neon)"/>
  </g>

  <!-- Palés con cajas (análisis de carga) -->
  <g filter="url(#soft)" transform="translate(150 610)">
    <path d="M0 70 L120 70 L160 50 L40 50 Z" fill="#d9a066"/>
    <path d="M0 70 L120 70 L120 86 L0 86 Z" fill="#b97f45"/>
    <path d="M120 70 L160 50 L160 66 L120 86 Z" fill="#a06c39"/>
    <path d="M14 66 L100 66 L100 6 L14 6 Z" fill="#e8c08f"/>
    <path d="M100 66 L134 49 L134 -11 L100 6 Z" fill="#cfa06b"/>
    <path d="M14 6 L100 6 L134 -11 L48 -11 Z" fill="#f2d3aa"/>
    <path d="M50 6 L84 -11" stroke="#cfa06b" stroke-width="4"/>
  </g>
  <rect x="140" y="584" width="190" height="130" rx="12" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="14 8" filter="url(#neon)"/>
</svg>
