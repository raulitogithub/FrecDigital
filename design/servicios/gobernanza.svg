<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#e6eef8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.42">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#00b4d8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a5a9c"/>
      <stop offset="1" stop-color="#14305a"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe3f5"/>
      <stop offset="1" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a3a6b" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a3a6b" flood-opacity="0.15"/>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="star" viewBox="-10 -10 20 20">
      <path d="M0 -9 L2.6 -2.9 L9 -2.8 L4 1.3 L5.6 7.6 L0 4 L-5.6 7.6 L-4 1.3 L-9 -2.8 L-2.6 -2.9 Z"/>
    </symbol>
  </defs>

  <rect width="1024" height="1024" fill="#eef3f9"/>
  <rect x="24" y="24" width="976" height="976" rx="40" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Baldosa con icono (arriba a la izquierda) -->
  <g filter="url(#soft)">
    <rect x="70" y="70" width="120" height="120" rx="28" fill="#ffffff" fill-opacity="0.9"/>
  </g>
  <g transform="translate(130 130)" fill="none" stroke="#1a3a6b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -32 L26 -22 V2 C26 18 14 28 0 34 C-14 28 -26 18 -26 2 V-22 Z"/>
    <path d="M-10 0 L-2 8 L12 -8" stroke="#22c55e"/>
  </g>

  <!-- Anillo de estrellas (referencia europea al AI Act) -->
  <g fill="#f5b800" fill-opacity="0.85">
    <use href="#star" x="500" y="168" width="28" height="28"/>
    <use href="#star" x="574" y="188" width="28" height="28"/>
    <use href="#star" x="628" y="242" width="28" height="28"/>
    <use href="#star" x="648" y="316" width="28" height="28"/>
    <use href="#star" x="628" y="390" width="28" height="28"/>
    <use href="#star" x="574" y="444" width="28" height="28"/>
    <use href="#star" x="500" y="464" width="28" height="28"/>
    <use href="#star" x="426" y="444" width="28" height="28"/>
    <use href="#star" x="372" y="390" width="28" height="28"/>
    <use href="#star" x="352" y="316" width="28" height="28"/>
    <use href="#star" x="372" y="242" width="28" height="28"/>
    <use href="#star" x="426" y="188" width="28" height="28"/>
  </g>

  <!-- Escudo central -->
  <g filter="url(#shadow)">
    <path d="M514 214 L614 252 V340 C614 400 572 438 514 462 C456 438 414 400 414 340 V252 Z" fill="url(#shield)"/>
  </g>
  <path d="M514 214 L614 252 V340 C614 400 572 438 514 462 C456 438 414 400 414 340 V252 Z" fill="none" stroke="url(#shieldEdge)" stroke-width="6" filter="url(#neon)"/>
  <path d="M474 336 L502 364 L558 306" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>

  <!-- Documento: política de uso de IA -->
  <g filter="url(#shadow)" transform="rotate(-6 230 420)">
    <rect x="140" y="300" width="190" height="240" rx="18" fill="url(#paper)"/>
  </g>
  <g transform="rotate(-6 230 420)">
    <text x="162" y="346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#1a3a6b">Política de</text>
    <text x="162" y="370" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#1a3a6b">uso de IA</text>
    <g stroke-linecap="round" stroke-width="7">
      <path d="M192 404 H300" stroke="#c9d6e6"/>
      <path d="M192 436 H286" stroke="#c9d6e6"/>
      <path d="M192 468 H300" stroke="#c9d6e6"/>
      <path d="M192 500 H270" stroke="#c9d6e6"/>
    </g>
    <g fill="#22c55e">
      <circle cx="170" cy="404" r="9"/><circle cx="170" cy="436" r="9"/>
      <circle cx="170" cy="468" r="9"/><circle cx="170" cy="500" r="9" fill="#f97316"/>
    </g>
  </g>

  <!-- Asistente de IA (destello) -->
  <g filter="url(#shadow)">
    <rect x="712" y="300" width="190" height="150" rx="26" fill="#ffffff"/>
  </g>
  <g transform="translate(762 375)">
    <path d="M0 -34 C4 -12 12 -4 34 0 C12 4 4 12 0 34 C-4 12 -12 4 -34 0 C-12 -4 -4 -12 0 -34 Z" fill="#00b4d8" filter="url(#neon)"/>
    <path d="M38 -30 C40 -22 44 -18 52 -16 C44 -14 40 -10 38 -2 C36 -10 32 -14 24 -16 C32 -18 36 -22 38 -30 Z" fill="#7fe3f5"/>
  </g>
  <g stroke-linecap="round" stroke-width="7">
    <path d="M820 356 H872" stroke="#1a3a6b"/>
    <path d="M820 384 H860" stroke="#c9d6e6"/>
    <path d="M820 410 H868" stroke="#c9d6e6"/>
  </g>

  <!-- Equipo conectado (formación) -->
  <g stroke="#00b4d8" stroke-width="3" stroke-dasharray="8 8" fill="none">
    <path d="M514 470 C514 520 360 520 330 580"/>
    <path d="M514 470 V585"/>
    <path d="M514 470 C514 520 668 520 698 580"/>
    <path d="M330 440 C380 470 430 470 450 440"/>
    <path d="M800 456 C780 500 740 520 700 560"/>
  </g>
  <g filter="url(#soft)">
    <circle cx="330" cy="622" r="44" fill="#ffffff"/>
    <circle cx="514" cy="628" r="44" fill="#ffffff"/>
    <circle cx="698" cy="622" r="44" fill="#ffffff"/>
  </g>
  <g fill="#1a3a6b">
    <circle cx="330" cy="608" r="14"/><path d="M304 648 C306 630 354 630 356 648 Z"/>
    <circle cx="514" cy="614" r="14"/><path d="M488 654 C490 636 538 636 540 654 Z"/>
    <circle cx="698" cy="608" r="14"/><path d="M672 648 C674 630 722 630 724 648 Z"/>
  </g>
  <!-- birrete sobre la persona central -->
  <g transform="translate(514 574)">
    <path d="M-30 0 L0 -14 L30 0 L0 14 Z" fill="#00b4d8"/>
    <path d="M-16 7 V18 C-8 24 8 24 16 18 V7" fill="#0284a8"/>
    <path d="M26 2 V20" stroke="#0284a8" stroke-width="3"/>
  </g>
</svg>
